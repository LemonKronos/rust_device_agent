[package]
name = "main_worker"
version = "0.3.3"
edition = "2024"
description = "Device Agent main logic"

[dependencies]
all-smi = "0.22.0"
chrono = "0.4.45"
flexi_logger = "0.31.9"
log = { version = "0.4.33", features = ["release_max_level_warn"] }
regex = "1.13.1"
rustc-hash = "2.1.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_with = "3.21.0"
sysinfo = "0.38.4"
tokio = "1.53.0"
ureq = { version = "3.3.0", features = ["json"] }

# Linux-only dependencies
[target.'cfg(target_os = "linux")'.dependencies]
smbios-lib = "0.9.2"

# Windows-only dependencies
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Power"] }
winreg = "0.56.0"
wmi = "0.18.4"

