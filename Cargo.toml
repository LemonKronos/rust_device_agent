[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["NgTrDat <trongdat4work@gmail.com>"]
description = "Gsoft Device Agent: multi-binary app to gather static and dynamic information for monitoring and maintenance corporation own device"
edition = "2024"

[profile.release]
opt-level = 'z'     # Optimize for size
lto = true          # Link-time optimization (makes a huge difference)
codegen-units = 1   # Slower compile time, smaller binary
strip = true        # Strip symbols from the binary
panic = 'abort'     # Removes panic unwinding overhead

[workspace.dependencies]
all-smi = "0.22.0"
chrono = "0.4.45"
flexi_logger = "0.31.9"
log = { version = "0.4.33", features = ["release_max_level_warn"] }
regex = "1.13.1"
rustc-hash = "2.1.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_with = "3.21.0"
sysinfo = "0.38.4"
tokio = "1.53.0"
ureq = { version = "3.3.0", features = ["json"] }

smbios-lib = "0.9.2"

windows-sys = { version = "0.61.2", features = ["Win32_System_Power"] }
winreg = "0.56.0"
wmi = "0.18.4"

