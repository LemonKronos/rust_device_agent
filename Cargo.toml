[package]
name = "gsoft_device_agent"
version = "0.1.0"
edition = "2024"

[dependencies]
all-smi = "0.22.0"
chrono = "0.4.45"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
smbios-lib = "0.9.2"
sysinfo = "0.38.4"
ureq = { version = "3.3.0", features = ["json"] }

# Windows-only dependencies
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Power"] }
winreg = "0.56.0"
wmi = "0.18.4"

[profile.release]
opt-level = 'z'     # Optimize for size
lto = true          # Link-time optimization (makes a huge difference)
codegen-units = 1   # Slower compile time, smaller binary
strip = true        # Strip symbols from the binary
panic = 'abort'     # Removes panic unwinding overhead